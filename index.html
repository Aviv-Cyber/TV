<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ממשק שידור חי - Broadcast Overlay</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font (Rubik for sleek Hebrew typography) -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rubik', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            overflow: hidden;
            /* Force 200% zoom default appearance */
            zoom: 200%;
            -moz-transform: scale(2);
            -moz-transform-origin: 0 0;
        }

        /* Glassmorphism Effects */
        .glass-panel {
            background: rgba(8, 12, 22, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Animations */
        @keyframes floatInBottom {
            0% { transform: translateY(40px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeInRight {
            0% { transform: translateX(30px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        .animate-float-bottom {
            animation: floatInBottom 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-fade-right {
            animation: fadeInRight 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 0px;
        }
    </style>
</head>
<body class="w-screen h-screen relative select-none bg-black overflow-hidden">

    <!-- BACKGROUND VIDEO -->
    <div class="absolute inset-0 z-0 bg-black overflow-hidden flex items-center justify-center">
        <video id="bgVideo" class="w-full h-full object-cover" autoplay loop playsinline>
            <source id="videoSource" src="" type="video/mp4">
        </video>
        <!-- Soft Gradient Overlay -->
        <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-black/30 pointer-events-none"></div>
    </div>


    <!-- ========================================== -->
    <!-- OVERLAY LAYER (HUD ELEMENTS) -->
    <!-- ========================================== -->
    <div class="relative z-10 w-full h-full flex flex-col justify-between p-0 pointer-events-none">

        <!-- TOP ROW: Channel Logo & Status (Clean, No Borders) -->
        <div class="w-full pt-8 px-10 flex justify-start items-center gap-3 pointer-events-auto">
            <div id="channelLogoBadge" class="w-12 h-12 bg-red-600 font-black text-2xl text-white flex items-center justify-center rounded-full shadow-lg">
                14
            </div>
            <div class="flex flex-col drop-shadow-md">
                <span class="text-[11px] font-black tracking-widest text-red-500 uppercase flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-red-600 animate-pulse"></span>
                    עכשיו
                </span>
                <span id="channelStatusText" class="text-xs font-bold text-white tracking-wide">שידור חי</span>
            </div>
        </div>


        <!-- SIDEBAR: Pure Frameless Vertical Menu (Stretches smoothly down to the lower third) -->
        <div class="absolute right-10 top-24 bottom-28 w-56 flex flex-col pointer-events-auto hidden md:flex z-20 animate-fade-right">
            <div class="h-full py-2 flex flex-col overflow-hidden">
                <!-- Section Title -->
                <div class="text-[11px] font-bold text-white/50 px-3 pb-3 uppercase tracking-wider drop-shadow">
                    תוכן הפרק
                </div>

                <!-- Navigation List Items -->
                <div id="sidebarList" class="flex-1 flex flex-col overflow-y-auto space-y-1 pr-1">
                    <!-- Items rendered dynamically from CONFIG -->
                </div>
            </div>
        </div>


        <!-- BOTTOM ROW: Clean Floating Lower-Third -->
        <div class="w-full px-10 pb-8 pointer-events-auto z-30 animate-float-bottom">
            <div class="w-full max-w-7xl mx-auto flex items-stretch shadow-2xl overflow-hidden">

                <!-- Main Show Badge Logo -->
                <div class="bg-blue-600 px-8 py-4 flex items-center justify-center font-black text-2xl md:text-3xl text-white tracking-wide flex-shrink-0 min-w-[200px]">
                    <div class="flex items-center gap-2">
                        <span class="text-amber-300 text-xl">★</span>
                        <span id="showTitle">הפטריוטים</span>
                    </div>
                </div>

                <!-- Text Banner & Sub-Ticker -->
                <div class="flex-1 bg-white text-slate-900 px-8 py-3.5 flex flex-col justify-center">
                    <!-- Main Highlight Headline -->
                    <div id="mainHeadline" class="font-black text-xl md:text-2xl text-slate-950 leading-tight">
                        --
                    </div>

                    <!-- Subtitle / Contact Ticker Line -->
                    <div id="subTicker" class="text-xs md:text-sm font-semibold text-slate-600 mt-0.5 flex items-center gap-2">
                        <span class="inline-block w-2 h-2 bg-red-600 rounded-full flex-shrink-0"></span>
                        <span id="subTickerText">--</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- ========================================== -->
    <!-- EASY CONFIGURATION SCRIPT                  -->
    <!-- ========================================== -->
    <script>
        /**
         * EASY EDIT CONFIGURATION
         */
        const CONFIG = {
            videoUrl: "vid.mp4",

            channelLogoText: "69",
            channelStatusText: "שידור חי",
            showTitle: "פרסום ישראל",

            mainHeadline: "לוח המודעות של ישראל",
            subTickerText: "רוצים לפרסם אצלנו? שלחו הודעה: 0548-144-606",

            activeTopicIndex: 7,
            topics: [
                "קוקה קולה",
                "רמי לוי",
                "אגאדיר",
                "חומוס אליהו",
                "ערוץ הספורט",
                "אורח באולפן",
                "מחלישים",
                "מורל לאומי",
                "מורל לאומי",
                "מורל לאומי",
                "מורל לאומי",
                "מורל לאומי",
                "מורל לאומי",
                "מורל לאומי",
                "מורל לאומי",
                "מורל לאומי",
                "היידה",
            ]
        };

        function initOverlay() {
            // Set Video Source
            const videoElement = document.getElementById('bgVideo');
            const videoSource = document.getElementById('videoSource');
            videoSource.src = CONFIG.videoUrl;
            videoElement.load();
            videoElement.muted = false;

            videoElement.play().catch(error => {
                console.log("Autoplay with sound was blocked, playing muted as fallback:", error);
                videoElement.muted = true;
                videoElement.play();
            });

            // Set Channel & Overlay Info
            document.getElementById('channelLogoBadge').innerText = CONFIG.channelLogoText;
            document.getElementById('channelStatusText').innerText = CONFIG.channelStatusText;
            document.getElementById('showTitle').innerText = CONFIG.showTitle;
            document.getElementById('mainHeadline').innerText = CONFIG.mainHeadline;
            document.getElementById('subTickerText').innerText = CONFIG.subTickerText;

            // Render Sidebar Topics
            renderSidebar();
        }

        function renderSidebar() {
            const container = document.getElementById('sidebarList');
            container.innerHTML = '';

            CONFIG.topics.forEach((topic, index) => {
                const isActive = index === CONFIG.activeTopicIndex;
                const item = document.createElement('div');
                item.className = `cursor-pointer transition-all duration-200 py-1.5 px-3 rounded flex items-center font-bold text-sm tracking-wide ${
                    isActive
                        ? 'bg-blue-600 text-white shadow-md self-start'
                        : 'text-white/80 hover:text-white hover:bg-white/10'
                }`;
                item.innerText = topic;
                item.onclick = () => {
                    CONFIG.activeTopicIndex = index;
                    renderSidebar();
                };
                container.appendChild(item);
            });
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', initOverlay);
    </script>
</body>
</html>
