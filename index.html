<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ממשק שידור חי - Broadcast Overlay</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font (Rubik for sleek Hebrew typography) -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rubik', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            overflow: hidden;
            /* Force 200% zoom default appearance */
            zoom: 200%;
            -moz-transform: scale(2);
            -moz-transform-origin: 0 0;
        }

        /* Glassmorphism Effects */
        .glass-panel {
            background: rgba(8, 12, 22, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Animations */
        @keyframes floatInBottom {
            0% { transform: translateY(40px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeInRight {
            0% { transform: translateX(30px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        .animate-float-bottom {
            animation: floatInBottom 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-fade-right {
            animation: fadeInRight 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 0px;
        }
    </style>
</head>
<body class="w-screen h-screen relative select-none bg-black overflow-hidden">

    <!-- BACKGROUND VIDEO -->
    <div class="absolute inset-0 z-0 bg-black overflow-hidden flex items-center justify-center">
        <video id="bgVideo" class="w-full h-full object-cover" autoplay loop playsinline>
        </video>

        <div id="videoErrorMsg" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-slate-900 text-center p-6 text-white/70 z-0">
            <svg class="w-12 h-12 mb-3 text-red-500/80" fill="none" stroke="currentColor" viewBox="0 0 24 24">

            <label class="mt-4 px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg cursor-pointer transition shadow-lg pointer-events-auto">
                בחר קובץ וידאו מהמחשב

        </div>
        <!-- Soft Gradient Overlay -->

    </div>


    <!-- ========================================== -->
    <!-- OVERLAY LAYER (HUD ELEMENTS) -->

    <div class="relative z-10 w-full h-full flex flex-col justify-between p-0 pointer-events-none">

                <div id="channelLogoBadge" class="w-12 h-12 bg-red-600 font-black text-2xl text-white flex items-center justify-center rounded-full shadow-lg">
                    14

                <div class="flex flex-col drop-shadow-md">
                    <span class="text-[11px] font-black tracking-widest text-red-500 uppercase flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-red-600 animate-pulse"></span>
                        עכשיו

                    <span id="channelStatusText" class="text-xs font-bold text-white tracking-wide">שידור חי</span>

            <label class="text-xs font-semibold bg-black/40 hover:bg-black/70 border border-white/20 text-white/80 hover:text-white px-3 py-1.5 rounded-full cursor-pointer backdrop-blur-md transition">
                <span>📁 החלף וידאו</span>

        <div class="absolute right-10 top-24 bottom-28 w-56 flex flex-col pointer-events-auto hidden md:flex z-20 animate-fade-right">

                "היידה",
            ]
        };

        function loadVideoSrc(src) {
            const videoElement = document.getElementById('bgVideo');
            const errorMsg = document.getElementById('videoErrorMsg');

            videoElement.onerror = function() {
                console.warn("Video failed to load:", src);
                if (errorMsg) errorMsg.classList.remove('hidden');
            };

            videoElement.src = src;
            videoElement.load();

            const playPromise = videoElement.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    if (errorMsg) errorMsg.classList.add('hidden');
                }).catch(error => {
                    console.log("Autoplay fallback:", error);
                    videoElement.muted = true;
                    videoElement.play().catch(() => {
                        if (errorMsg) errorMsg.classList.remove('hidden');
                    });
                });
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const blobUrl = URL.createObjectURL(file);
                loadVideoSrc(blobUrl);
            }
        }

        function initOverlay() {
            // Set Video Source
            if (CONFIG.videoUrl) {
                loadVideoSrc(CONFIG.videoUrl);
            }

            // Bind file inputs
            document.getElementById('videoFileInput').addEventListener('change', handleFileSelect);
            document.getElementById('topVideoFileInput').addEventListener('change', handleFileSelect);

            // Set Channel & Overlay Info
            document.getElementById('channelLogoBadge').innerText = CONFIG.channelLogoText;
            document.getElementById('channelStatusText').innerText = CONFIG.channelStatusText;
            document.getElementById('showTitle').innerText = CONFIG.showTitle;
            document.getElementById('mainHeadline').innerText = CONFIG.mainHeadline;
            document.getElementById('subTickerText').innerText = CONFIG.subTickerText;

            // Render Sidebar Topics
            renderSidebar();
        }
